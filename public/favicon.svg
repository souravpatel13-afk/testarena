<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Background Shield/Square -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="94" fill="none" stroke="#10b981" stroke-width="8" stroke-opacity="0.4"/>
  <!-- Target / Academic Shield Symbol -->
  <g transform="translate(256, 230)">
    <!-- Outer Shield Contour -->
    <path d="M 0 -130 C 80 -130 140 -110 140 -20 C 140 80 70 140 0 170 C -70 140 -140 80 -140 -20 C -140 -110 -80 -130 0 -130 Z" fill="url(#shieldGrad)" opacity="0.95"/>
    <path d="M 0 -110 C 65 -110 115 -90 115 -15 C 115 65 55 115 0 142 C -55 115 -115 65 -115 -15 C -115 -90 -65 -110 0 -110 Z" fill="#064e3b"/>
    <!-- Target Bullseye Rings -->
    <circle cx="0" cy="-5" r="55" fill="none" stroke="#f59e0b" stroke-width="12"/>
    <circle cx="0" cy="-5" r="28" fill="#f59e0b"/>
    <!-- Checkmark inside bullseye -->
    <path d="M -10 -5 L -2 3 L 12 -11" fill="none" stroke="#047857" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Text Label -->
  <text x="256" y="445" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="2">TEST ARENA</text>
</svg>
